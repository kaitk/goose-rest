# production-stack: stock nginx (proxy/nginx.conf) as the edge, HttpArena's
# shared authsvc, which the edge asks to verify each /api/* request's JWT, the
# Redis the profile requires, and the entry's server, whose cache is its own,
# in process (app.goose), so it doesn't use the Redis. The CPU split is the
# reference entry's. Modelled on libuvcpp's compose.production-stack.yml.
services:
  edge:
    image: nginx:1.27-alpine
    command: ["nginx", "-g", "daemon off; worker_processes 30;"]
    network_mode: host
    cpuset: "0-14,64-78"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      authsvc:
        condition: service_healthy
      server:
        condition: service_started

  cache:
    image: redis:7-alpine
    network_mode: host
    cpuset: "15,79"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${DATA_DIR}/redis-seed.txt:/seed.txt:ro
      - ${DATA_DIR}/redis-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 1s

  authsvc:
    build: ../_shared/authsvc
    network_mode: host
    cpuset: "16-19,80-83"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - JWT_SECRET=httparena-bench-secret-do-not-use-in-production
      - AUTHSVC_LISTEN=0.0.0.0:9090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/_health"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 1s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    cpuset: "20-31,84-95"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=256
      - PROXY_PORT=8085
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
    depends_on:
      cache:
        condition: service_healthy
